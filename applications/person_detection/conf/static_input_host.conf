# Static embedded image + UART binary stream for desktop viewer (nRF9251 DK).
CONFIG_PERSON_DET_STATIC_INPUT=y
CONFIG_PERSON_DET_STATIC_EMBEDDED_IMAGE=y
CONFIG_PERSON_DET_HOST_STREAM=y

CONFIG_SPI=n
CONFIG_VIDEO=n

# Binary stream owns the console UART — no text logs on the same port.
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_UART_CONSOLE=n

CONFIG_SERIAL=y
CONFIG_CRC=y
