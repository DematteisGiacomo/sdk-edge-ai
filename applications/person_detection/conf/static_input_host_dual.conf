# Static embedded image + host stream on person-det,host-stream-uart (nRF9251: uart132 / VCOM1).
# Text logs remain on zephyr,console (uart133 / VCOM0).
CONFIG_PERSON_DET_STATIC_INPUT=y
CONFIG_PERSON_DET_STATIC_EMBEDDED_IMAGE=y
CONFIG_PERSON_DET_HOST_STREAM=y

CONFIG_SPI=n
CONFIG_VIDEO=n

CONFIG_SERIAL=y
CONFIG_CRC=y

CONFIG_THREAD_ANALYZER=y

