# Logging (results are reported on the console UART)
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# LEDs
CONFIG_GPIO=y

# Axon NPU (interlayer buffer size is set in Kconfig)
CONFIG_NRF_AXON=y

# Frame input from the host
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y
CONFIG_CRC=y

# Other
CONFIG_ASSERT=y
CONFIG_MAIN_STACK_SIZE=2048
