sample:
  description: Image classification from host-fed frames
  name: image_classification

common:
  sysbuild: true
  build_only: true
  tags:
    - ci_build
    - sysbuild
    - ci_applications_image_classification
  harness: console
  harness_config:
    type: multi_line
    regex:
      - "waiting for frames from host"

tests:
  applications.image_classification.cifar10:
    platform_allow:
      - nrf9251dk/nrf9251/cpuapp
    integration_platforms:
      - nrf9251dk/nrf9251/cpuapp

  applications.image_classification.vww:
    extra_args:
      - EXTRA_CONF_FILE="vww.conf"
    platform_allow:
      - nrf9251dk/nrf9251/cpuapp
    integration_platforms:
      - nrf9251dk/nrf9251/cpuapp

  applications.image_classification.wildfire:
    extra_args:
      - EXTRA_CONF_FILE="wildfire.conf"
    platform_allow:
      - nrf9251dk/nrf9251/cpuapp
    integration_platforms:
      - nrf9251dk/nrf9251/cpuapp
