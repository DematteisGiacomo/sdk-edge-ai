# Frames from the host on person-det,host-stream-uart (nRF9251: uart132 / VCOM1, RX only).
# Inference results are logged on zephyr,console (uart133 / VCOM0).
# Use with boards/nrf9251dk_nrf9251_cpuapp_static_host_dual.overlay and
# scripts/feed_images_uart.py.
CONFIG_PERSON_DET_STATIC_INPUT=y
CONFIG_PERSON_DET_HOST_INPUT=y

CONFIG_SPI=n
CONFIG_VIDEO=n

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
