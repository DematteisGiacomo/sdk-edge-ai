sample:
  description: Wildfire classification from host-fed frames
  name: wildfire_classification

common:
  sysbuild: true
  build_only: true
  tags:
    - ci_build
    - sysbuild
    - ci_applications_wildfire_classification
  harness: console
  harness_config:
    type: multi_line
    regex:
      - "waiting for frames from host"

tests:
  applications.wildfire_classification:
    platform_allow:
      - nrf9251dk/nrf9251/cpuapp
    integration_platforms:
      - nrf9251dk/nrf9251/cpuapp
